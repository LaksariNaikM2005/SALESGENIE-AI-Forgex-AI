name: FORGE_X AI CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-and-ml-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r ai_ml_engine/requirements.txt
          pip install pytest pytest-cov

      - name: Validate ML Data Loader
        run: |
          if [ -d "ai_ml_engine/data/raw" ]; then
            python -m ai_ml_engine.preprocessing.data_loader
          else
            echo "Skipping Data Loader validation: ai_ml_engine/data/raw not present in CI checkout."
          fi

      - name: Validate ML Preprocessing Pipeline
        run: |
          if [ -d "ai_ml_engine/data/raw" ]; then
            python -m ai_ml_engine.preprocessing.preprocessor
          else
            echo "Skipping Preprocessing validation: ai_ml_engine/data/raw not present in CI checkout."
          fi

      - name: Run Test Suite
        env:
          FLASK_ENV: testing
          JWT_SECRET_KEY: test-secret-key-ci
        run: |
          pytest -v

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

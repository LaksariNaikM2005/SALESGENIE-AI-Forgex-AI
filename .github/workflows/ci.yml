name: SalesGenie AI Enterprise CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-and-celery-tests:
    name: FastAPI, PostgreSQL, Redis & Celery Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salesgenie
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate ML Data Loader
        env:
          PYTHONPATH: .
        run: |
          python -m ai_ml_engine.preprocessing.data_loader

      - name: Validate ML Preprocessing Pipeline
        env:
          PYTHONPATH: .
        run: |
          python -m ai_ml_engine.preprocessing.preprocessor

      - name: Validate FastAPI App & Celery Tasks
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/salesgenie
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          CELERY_ALWAYS_EAGER: "true"
          JWT_SECRET_KEY: ci-test-secret-key-fastapi
        run: |
          python -c "from backend.app.main import app; print('FastAPI loaded successfully, routes:', len(app.routes))"
          python -c "from backend.app.celery_app import celery_app; print('Celery initialized successfully')"

  frontend-nextjs-build:
    name: Next.js + React + TypeScript Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build Next.js TypeScript Application
        run: |
          cd frontend
          npm run build
